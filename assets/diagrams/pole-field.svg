<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-labelledby="title desc">
  <title id="title">磁界中の試験N極に働く力FイコールmH</title>
  <desc id="desc">左の磁石のN極付近の磁界を磁極モデルで表す。反対のS極は図の外。青い磁界HはN極から放射状に外向き。距離rの場所に置いた小さな試験N極は、その場所のHと同じ向きに力Fを受ける。mは試験N極の磁極の強さで単位はWb、FイコールmH。導体に働く電磁力の図ではない。</desc>
  <defs><marker id="field" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L9 5L0 9Z" fill="#2563a6"/></marker><marker id="force" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L11 6L0 11Z" fill="#bd6b20"/></marker></defs>
  <style>svg{font-size:18px;fill:#173f39}text{font-family:"Yu Gothic","Meiryo",sans-serif}.title{font-size:23px;font-weight:700}.note{fill:#52736c}.formula{font-size:22px;font-weight:700}</style>
  <rect width="480" height="280" rx="16" fill="#f3f8fc"/>
  <text x="24" y="32" class="title">磁極に働く力：N極は H の向き</text>
  <text x="24" y="60" class="note">N極付近のモデル（S極は図の外）</text>
  <g fill="none" stroke="#2563a6" stroke-width="2.5" marker-end="url(#field)"><path d="M149 151H277"/><path d="M101 151H64"/><path d="M125 127V94"/><path d="M125 175V208"/><path d="M142 134L166 110"/><path d="M108 134L84 110"/><path d="M108 168L84 192"/><path d="M142 168L166 192"/></g>
  <circle cx="125" cy="151" r="20" fill="#b84038"/><text x="125" y="158" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">N</text>
  <circle cx="300" cy="151" r="15" fill="#b84038"/><text x="300" y="157" text-anchor="middle" fill="#fff" font-weight="700">N</text>
  <text x="300" y="100" text-anchor="middle">小さな試験N極</text><text x="300" y="124" text-anchor="middle" class="note">磁極の強さ m</text>
  <text x="218" y="137" text-anchor="middle" fill="#2563a6" font-size="21">H</text>
  <path d="M318 151H432" fill="none" stroke="#bd6b20" stroke-width="3.5" marker-end="url(#force)"/>
  <text x="383" y="136" text-anchor="middle" fill="#bd6b20" font-size="22">F</text>
  <path d="M125 216V225H300V216" fill="none" stroke="#12685a" stroke-width="1.8"/>
  <text x="213" y="217" text-anchor="middle" font-size="22">r</text>
  <rect x="24" y="239" width="432" height="30" rx="8" fill="#fff" stroke="#d5e4df"/>
  <text x="240" y="262" text-anchor="middle" class="formula">F = mH　m：試験N極の強さ〔Wb〕</text>
</svg>
