<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-labelledby="title desc">
  <title id="title">十分長いソレノイドの中央付近では内部磁界がほぼ一様</title>
  <desc id="desc">ソレノイドを横から見た模式図。上側の導線を流れる電流は紙面手前、下側は紙面奥へ向く。この向きの電流がつくる内部磁界Hは右向き。端の影響を無視できる十分長いコイルではHイコールNI。この図のNは全巻数ではなく、1メートルあたりの巻数。</desc>
  <defs><marker id="field" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L10 5.5L0 10Z" fill="#2563a6"/></marker>
    <g id="turn"><ellipse cy="150" rx="8" ry="45" fill="none" stroke="#12685a" stroke-width="2.1"/><circle cy="105" r="7" fill="#fff7ec" stroke="#bd6b20" stroke-width="1.8"/><circle cy="105" r="2.7" fill="#bd6b20"/><circle cy="195" r="7" fill="#fff7ec" stroke="#bd6b20" stroke-width="1.8"/><path d="M-3 192L3 198M-3 198L3 192" stroke="#bd6b20" stroke-width="1.8"/></g>
  </defs>
  <style>svg{font-size:18px;fill:#173f39}text{font-family:"Yu Gothic","Meiryo",sans-serif}.title{font-size:23px;font-weight:700}.note{fill:#52736c}.formula{font-size:25px;font-weight:700}</style>
  <rect width="480" height="280" rx="16" fill="#f3f8fc"/>
  <text x="24" y="32" class="title">ソレノイド：内部はほぼ一様</text>
  <text x="24" y="60" class="note">十分長いコイルの中央付近</text>
  <rect x="85" y="106" width="301" height="88" rx="8" fill="#e9f2fa"/>
  <g><use href="#turn" x="100"/><use href="#turn" x="130"/><use href="#turn" x="160"/><use href="#turn" x="190"/><use href="#turn" x="220"/><use href="#turn" x="250"/><use href="#turn" x="280"/><use href="#turn" x="310"/><use href="#turn" x="340"/><use href="#turn" x="370"/></g>
  <g fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#field)"><path d="M89 130H395"/><path d="M89 150H395"/><path d="M89 170H395"/></g>
  <text x="415" y="158" fill="#2563a6" font-size="25">H</text>
  <text x="51" y="112" fill="#bd6b20" font-size="20">I</text><text x="51" y="202" fill="#bd6b20" font-size="20">I</text>
  <text x="80" y="231" fill="#bd6b20">⊙ 手前　⊗ 奥</text><text x="302" y="231" class="formula">H = NI</text>
  <text x="240" y="264" text-anchor="middle" class="note">N：1 m あたりの巻数〔回/m〕</text>
</svg>
