<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-labelledby="title desc">
  <title id="title">円形コイルの電流が反時計回りなら、中心の磁界は紙面手前</title>
  <desc id="desc">半径rの円形コイルを正面から見る。電流Iの矢印は反時計回り。中心の丸と点は紙面手前に向く磁界H。Nは重ねて巻いた全巻数で、中心ではHイコールNI割る2rとなる。</desc>
  <defs><marker id="current" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L10 5.5L0 10Z" fill="#bd6b20"/></marker></defs>
  <style>svg{font-size:18px;fill:#173f39}text{font-family:"Yu Gothic","Meiryo",sans-serif}.title{font-size:23px;font-weight:700}.note{fill:#52736c}.formula{font-size:23px;font-weight:700}</style>
  <rect width="480" height="280" rx="16" fill="#f3f8fc"/>
  <text x="24" y="32" class="title">円形コイル：中心の磁界を考える</text>
  <text x="24" y="60" class="note">電流 I が反時計回り → H は手前 ⊙</text>
  <circle cx="151" cy="149" r="71" fill="#fff" stroke="#12685a" stroke-width="4"/>
  <path d="M212.49 184.5A71 71 0 0 0 186.5 87.51" fill="none" stroke="#bd6b20" stroke-width="4" marker-end="url(#current)"/>
  <path d="M151 149L201.2 199.2" fill="none" stroke="#12685a" stroke-width="1.8" stroke-dasharray="4 4"/>
  <circle cx="151" cy="149" r="11" fill="#eef5fd" stroke="#2563a6" stroke-width="2.8"/><circle cx="151" cy="149" r="3.8" fill="#2563a6"/>
  <text x="167" y="140" fill="#2563a6" font-size="22">H</text><text x="193" y="178" font-size="22">r</text><text x="236" y="120" fill="#bd6b20" font-size="23">I</text>
  <text x="278" y="114" fill="#2563a6">中心の磁界</text>
  <text x="278" y="150" class="formula">H = NI / (2r)</text>
  <text x="278" y="190" class="note">N：全体の巻数</text>
  <text x="278" y="219" class="note">r：コイルの半径</text>
  <text x="240" y="260" text-anchor="middle" class="note">右手の指を電流に沿わせ、親指が H</text>
</svg>
