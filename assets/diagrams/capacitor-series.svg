<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-labelledby="title desc">
  <title id="title">未充電のコンデンサを直列で充電すると、電荷の大きさが同じ</title>
  <desc id="desc">C1とC2を直列につなぎ未充電の状態から端子間に電圧を加える。中間の孤立した導体の正味電荷は0なので、各極板の電荷は順にプラスQ、マイナスQ、プラスQ、マイナスQとなる。電圧VはV1とV2に分かれる。</desc>
  <style>svg{font-size:18px;fill:#173f39}text{font-family:"Yu Gothic","Meiryo",sans-serif}.title{font-size:23px;font-weight:700}.note{fill:#52736c}.wire{fill:none;stroke:#12685a;stroke-width:3.5;stroke-linecap:round}.positive{fill:#bd6b20}.negative{fill:#2563a6}.formula{font-size:20px;font-weight:700}</style>
  <rect width="480" height="280" rx="16" fill="#f5faf8"/>
  <text x="24" y="32" class="title">直列：電荷 Q の大きさが共通</text>
  <text x="24" y="60" class="note">未充電から充電／中間の正味電荷は0</text>
  <g class="wire"><path d="M54 132H152M170 132H310M328 132H426"/><path d="M152 107V157M170 107V157M310 107V157M328 107V157"/></g>
  <g fill="#12685a"><circle cx="54" cy="132" r="4"/><circle cx="426" cy="132" r="4"/></g>
  <text x="54" y="111" text-anchor="middle">A</text><text x="426" y="111" text-anchor="middle">B</text>
  <text x="161" y="94" text-anchor="middle" font-size="20">C₁</text><text x="319" y="94" text-anchor="middle" font-size="20">C₂</text>
  <text x="141" y="181" text-anchor="middle" class="positive">+Q</text><text x="183" y="181" text-anchor="middle" class="negative">−Q</text>
  <text x="298" y="181" text-anchor="middle" class="positive">+Q</text><text x="341" y="181" text-anchor="middle" class="negative">−Q</text>
  <g fill="none" stroke="#bd6b20" stroke-width="2"><path d="M112 196V203H210V196M270 196V203H368V196"/></g>
  <text x="161" y="225" text-anchor="middle" class="positive">V₁</text><text x="319" y="225" text-anchor="middle" class="positive">V₂</text>
  <rect x="24" y="238" width="432" height="30" rx="8" fill="#fff" stroke="#d5e4df"/>
  <text x="240" y="260" text-anchor="middle" class="formula">V = V₁ + V₂　　1/C = 1/C₁ + 1/C₂</text>
</svg>
