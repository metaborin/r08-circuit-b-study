<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-labelledby="title desc">
  <title id="title">紙面手前に流れる直線電流の磁界は反時計回り</title>
  <desc id="desc">十分長い直線導体を断面で見る。中央の丸と点は紙面手前に流れる電流I。青い磁界Hは導体を中心とした反時計回りの同心円。rは導体からの垂直距離で、HはIを2πrで割った値。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1L9 5L0 9Z" fill="#2563a6"/></marker></defs>
  <style>svg{font-size:18px;fill:#173f39}text{font-family:"Yu Gothic","Meiryo",sans-serif}.title{font-size:23px;font-weight:700}.note{fill:#52736c}.field{fill:none;stroke:#2563a6;stroke-width:2.5}.formula{font-size:23px;font-weight:700}</style>
  <rect width="480" height="280" rx="16" fill="#f3f8fc"/>
  <text x="24" y="32" class="title">直線導体：磁界は同心円</text>
  <text x="24" y="60" class="note">電流が手前 ⊙ のとき、反時計回り</text>
  <g class="field"><circle cx="151" cy="150" r="32"/><circle cx="151" cy="150" r="55"/><circle cx="151" cy="150" r="80"/>
    <path d="M161 70H141" marker-end="url(#arrow)"/><path d="M141 205H161" marker-end="url(#arrow)"/><path d="M183 159V141" marker-end="url(#arrow)"/>
  </g>
  <path d="M151 150L220.28 190" fill="none" stroke="#12685a" stroke-width="1.8" stroke-dasharray="4 4"/>
  <circle cx="151" cy="150" r="12" fill="#fff9f0" stroke="#bd6b20" stroke-width="2.5"/><circle cx="151" cy="150" r="4" fill="#bd6b20"/>
  <text x="128" y="176" fill="#bd6b20" font-size="21">I</text><text x="199" y="171" font-size="22">r</text>
  <text x="268" y="115" fill="#bd6b20">⊙：電流 I が手前</text>
  <text x="268" y="154" fill="#2563a6">磁界 H は周りを回る</text>
  <text x="268" y="195" class="note">距離 r は導体から</text>
  <rect x="24" y="238" width="432" height="30" rx="8" fill="#fff" stroke="#d5e4df"/>
  <text x="240" y="261" text-anchor="middle" class="formula">H = I / (2πr)</text>
</svg>
