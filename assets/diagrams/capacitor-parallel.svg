<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-labelledby="title desc">
  <title id="title">並列接続では、各コンデンサの電圧が同じ</title>
  <desc id="desc">2個のコンデンサC1とC2は同じ2点AとBの間につながる。各枝の電圧V1とV2は端子間電圧Vに等しく、合成静電容量はC1とC2の和。</desc>
  <style>svg{font-size:18px;fill:#173f39}text{font-family:"Yu Gothic","Meiryo",sans-serif}.title{font-size:23px;font-weight:700}.note{fill:#52736c}.formula{font-size:22px;font-weight:700}.wire{fill:none;stroke:#12685a;stroke-width:3.5;stroke-linecap:round}.voltage{fill:#bd6b20;font-size:20px}</style>
  <rect width="480" height="280" rx="16" fill="#f5faf8"/>
  <text x="24" y="32" class="title">並列：電圧 V が共通</text>
  <text x="24" y="60" class="note">A側どうし・B側どうしをつなぐ</text>
  <g class="wire">
    <path d="M110 110V183M370 110V183M110 110H230M250 110H370M110 183H230M250 183H370"/>
    <path d="M230 95V125M250 95V125M230 168V198M250 168V198"/>
    <path d="M72 146H110M370 146H408"/>
  </g>
  <g fill="#12685a"><circle cx="110" cy="146" r="4.5"/><circle cx="370" cy="146" r="4.5"/><circle cx="72" cy="146" r="4"/><circle cx="408" cy="146" r="4"/></g>
  <text x="51" y="153" font-weight="700">A</text><text x="421" y="153" font-weight="700">B</text>
  <text x="240" y="87" text-anchor="middle" font-size="20">C₁</text>
  <text x="240" y="160" text-anchor="middle" font-size="20">C₂</text>
  <text x="306" y="100" class="voltage">V₁</text><text x="306" y="173" class="voltage">V₂</text>
  <rect x="24" y="230" width="432" height="36" rx="9" fill="#fff" stroke="#d5e4df"/>
  <text x="240" y="255" text-anchor="middle" class="formula">V₁ = V₂ = V　　C = C₁ + C₂</text>
</svg>
